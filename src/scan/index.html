<!doctype html><html lang="ur" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0d4b3c"><title>Emergency reporting</title><link rel="manifest" href="/scan/manifest.webmanifest"><link rel="stylesheet" href="/scan/scan.css"></head><body><main><header><div><b id="brand">Alkhidmat</b><p id="village">Village report</p></div><button id="language" type="button">English</button></header><section class="card"><h1 id="title">مدد کی اطلاع</h1><p id="instruction">براہِ کرم مدد کی قسم منتخب کریں۔</p><p class="warning" id="warning">یہ اطلاع دینے کی سروس ہے، ایمبولینس سروس نہیں۔ اگر جان کو خطرہ ہو تو پہلے 1122 پر کال کریں۔</p><div class="types"><button data-type="pregnancy"><span>◉</span><b id="pregnancy">حمل / ماں</b></button><button data-type="child"><span>♥</span><b id="child">بچہ</b></button><button data-type="accident"><span>!</span><b id="accident">حادثہ</b></button><button data-type="other"><span>…</span><b id="other">دیگر</b></button></div><label id="phone-label">فون نمبر (اختیاری)<input id="phone" inputmode="tel" autocomplete="tel" maxlength="20"></label><input id="website" class="honeypot" tabindex="-1" autocomplete="off"><div id="status" role="status"></div><button id="sms" class="sms" hidden type="button">SMS سے بھیجیں</button></section><p class="small" id="offline">انٹرنیٹ نہ ہونے پر اطلاع اس فون پر محفوظ ہو جائے گی اور کنکشن ملنے پر بھیج دی جائے گی۔</p></main><script src="/scan/scan.js"></script></body></html>
