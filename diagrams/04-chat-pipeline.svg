<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" font-family="Inter,Arial,sans-serif">
  <rect width="960" height="680" fill="#f7f3e9"/>
  <text x="480" y="38" text-anchor="middle" font-size="20" font-weight="800" fill="#0d4b3c">AI Chat Pipeline</text>
  <text x="480" y="58" text-anchor="middle" font-size="11" fill="#64756e">User Question → Intent Analysis → Deterministic / External / AI-Assisted Response</text>

  <!-- User Input -->
  <rect x="40" y="85" width="200" height="120" rx="8" fill="#0d4b3c"/>
  <text x="140" y="113" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">User Question</text>
  <text x="140" y="135" text-anchor="middle" font-size="10" fill="#b9d4c5">POST /api/chat</text>
  <text x="140" y="155" text-anchor="middle" font-size="10" fill="#b9d4c5">{ question: string }</text>
  <text x="140" y="175" text-anchor="middle" font-size="10" fill="#b9d4c5">max 1,500 characters</text>
  <text x="140" y="195" text-anchor="middle" font-size="9" fill="#7a9e8e">English / Urdu / Roman Urdu</text>

  <line x1="240" y1="145" x2="290" y2="145" stroke="#148064" stroke-width="2" marker-end="url(#arr3)"/>

  <!-- Intent Analysis -->
  <rect x="290" y="85" width="200" height="120" rx="8" fill="#fff" stroke="#148064" stroke-width="2"/>
  <text x="390" y="113" text-anchor="middle" font-size="13" font-weight="700" fill="#0d4b3c">Intent Analyzer</text>
  <text x="390" y="133" text-anchor="middle" font-size="10" fill="#64756e">chatEngine.analyze()</text>
  <text x="390" y="155" text-anchor="middle" font-size="10" fill="#148064" font-weight="600">Detects:</text>
  <text x="390" y="172" text-anchor="middle" font-size="9" fill="#64756e">intent, language, entities</text>
  <text x="390" y="188" text-anchor="middle" font-size="9" fill="#64756e">location match, topic</text>

  <!-- Three paths -->
  <line x1="490" y1="120" x2="540" y2="95" stroke="#148064" stroke-width="1.5" marker-end="url(#arr3)"/>
  <line x1="490" y1="145" x2="540" y2="235" stroke="#148064" stroke-width="1.5" marker-end="url(#arr3)"/>
  <line x1="490" y1="170" x2="540" y2="375" stroke="#148064" stroke-width="1.5" marker-end="url(#arr3)"/>

  <!-- Path labels -->
  <text x="520" y="88" font-size="9" fill="#148064" font-weight="700">internal</text>
  <text x="520" y="228" font-size="9" fill="#dc7417" font-weight="700">ext_*</text>
  <text x="520" y="368" font-size="9" fill="#64756e" font-weight="700">fallback</text>

  <!-- Deterministic Engine -->
  <rect x="540" y="70" width="380" height="110" rx="8" fill="#dff0e8" stroke="#148064"/>
  <text x="730" y="98" text-anchor="middle" font-size="13" font-weight="700" fill="#0d4b3c">Deterministic Engine</text>
  <text x="730" y="118" text-anchor="middle" font-size="10" fill="#64756e">chatEngine.answer(analysis, dataset)</text>
  <line x1="560" y1="130" x2="900" y2="130" stroke="#c6dfd1" stroke-width="0.5"/>
  <text x="560" y="148" font-size="10" fill="#17342c">&#x2022; Priority scores, rankings, comparisons</text>
  <text x="560" y="164" font-size="10" fill="#17342c">&#x2022; Location-specific explanations</text>

  <!-- External Sources -->
  <rect x="540" y="210" width="380" height="130" rx="8" fill="#fce9d3" stroke="#dc7417"/>
  <text x="730" y="238" text-anchor="middle" font-size="13" font-weight="700" fill="#0d4b3c">External Sources (secure server)</text>
  <text x="730" y="258" text-anchor="middle" font-size="10" fill="#64756e">handleExternal(intent, analysis, dataset)</text>
  <line x1="560" y1="270" x2="900" y2="270" stroke="#efd7ae" stroke-width="0.5"/>
  <text x="560" y="288" font-size="10" fill="#a04e0b">&#x2022; WHO health indicators</text>
  <text x="560" y="304" font-size="10" fill="#a04e0b">&#x2022; NDMA flood alerts</text>
  <text x="560" y="320" font-size="10" fill="#a04e0b">&#x2022; Census / PBS data</text>
  <text x="760" y="288" font-size="10" fill="#a04e0b">&#x2022; BHU listings</text>
  <text x="760" y="304" font-size="10" fill="#a04e0b">&#x2022; Rescue 1122</text>
  <text x="760" y="320" font-size="10" fill="#a04e0b">&#x2022; OSM facilities</text>

  <!-- Fallback AI -->
  <rect x="540" y="365" width="380" height="110" rx="8" fill="#fff" stroke="#dce4d9"/>
  <text x="730" y="393" text-anchor="middle" font-size="13" font-weight="700" fill="#0d4b3c">AI-Assisted Fallback</text>
  <text x="730" y="413" text-anchor="middle" font-size="10" fill="#64756e">Grok API (grok-3-mini) — optional</text>
  <line x1="560" y1="425" x2="900" y2="425" stroke="#dce4d9" stroke-width="0.5"/>
  <text x="560" y="443" font-size="10" fill="#17342c">&#x2022; System prompt with verified dataset only</text>
  <text x="560" y="459" font-size="10" fill="#17342c">&#x2022; 20-second timeout, graceful fallback</text>

  <!-- Response -->
  <rect x="40" y="500" width="880" height="65" rx="8" fill="#fff" stroke="#dce4d9"/>
  <text x="480" y="528" text-anchor="middle" font-size="13" font-weight="700" fill="#0d4b3c">Response Format</text>
  <text x="480" y="548" text-anchor="middle" font-size="10" fill="#64756e">{ answer, lang, intent, origin, meta: { source, url, retrievedAt, status } }</text>

  <line x1="730" y1="180" x2="730" y2="500" stroke="#148064" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr3)"/>
  <line x1="730" y1="340" x2="730" y2="500" stroke="#dc7417" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr3)"/>
  <line x1="730" y1="475" x2="730" y2="500" stroke="#64756e" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr3)"/>

  <!-- Meta indicators -->
  <rect x="40" y="590" width="430" height="70" rx="8" fill="#edf6ef" stroke="#148064"/>
  <text x="255" y="618" text-anchor="middle" font-size="12" font-weight="700" fill="#148064">Internal Data Badge</text>
  <text x="255" y="638" text-anchor="middle" font-size="10" fill="#64756e">Green badge: "Source: Internal dashboard dataset"</text>
  <text x="255" y="652" text-anchor="middle" font-size="10" fill="#64756e">Shows data confidence and origin</text>

  <rect x="490" y="590" width="430" height="70" rx="8" fill="#fce9d3" stroke="#dc7417"/>
  <text x="705" y="618" text-anchor="middle" font-size="12" font-weight="700" fill="#a04e0b">External Data Badge</text>
  <text x="705" y="638" text-anchor="middle" font-size="10" fill="#64756e">Orange badge: "Source: [external source name]"</text>
  <text x="705" y="652" text-anchor="middle" font-size="10" fill="#64756e">Reference-only, never overwrites dataset</text>

  <defs><marker id="arr3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#148064"/></marker></defs>
</svg>
